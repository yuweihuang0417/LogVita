<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#123334"/>
      <stop offset="100%" stop-color="#0a2021"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#79e2c4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#79e2c4" stop-opacity="0"/>
    </radialGradient>
