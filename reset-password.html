<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>健康庫 LogVita — 重設密碼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="index.css?v=5">
</head>
<body>

<div class="stage">
 <div class="brand">
 <div class="brand-top-row">
 <div class="brand-mark"><span class="dot"></span> 健康庫 LogVita</div>
 <div class="language-switcher" aria-label="Language selector">
 <select id="language-select">
 <option value="zh-TW">繁體中文</option>
 <option value="zh-CN">简体中文</option>
 <option value="en">English</option>
 <option value="ja">日本語</option>
 <option value="ko">한국어</option>
 </select>
 </div>
 </div>
 <div class="brand-copy">
 <h1>把每一次<em>健康紀錄</em><br>安心留在身邊</h1>
 <p>檢驗報告、用藥紀錄、影像資料，通通存進你自己的 Google Drive 或 Dropbox，並能自訂期限與範圍分享給家人與醫療人員。</p>
 <div class="trust">
 <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
 <path d="M12 2L4 5v6c0 5 3.4 8.7 8 9.9 4.6-1.2 8-4.9 8-9.9V5l-8-3z" stroke="#79e2c4" stroke-width="1.6" stroke-linejoin="round"/>
 </svg>
 <span>資料採加密儲存，僅本人與您授權的對象可讀取</span>
 </div>
 </div>
 <div class="pulse-wrap" aria-hidden="true">
 <svg viewBox="0 0 420 70" xmlns="http://www.w3.org/2000/svg">
 <polyline class="pulse-line" points="0,35 60,35 80,35 95,10 110,60 125,35 150,35 170,35 185,20 200,50 215,35 420,35"/>
 </svg>
 </div>
 </div>

 <div class="panel">
 <div class="card">

 <!-- 狀態一：正在驗證重設連結 -->
 <div id="state-verifying">
 <p class="eyebrow" id="verifying-eyebrow">請稍候</p>
 <h2 id="verifying-heading">正在驗證重設連結…</h2>
 </div>

 <!-- 狀態二：連結有效，顯示設定新密碼表單 -->
 <div id="state-form" style="display:none;">
 <p class="eyebrow" id="form-eyebrow">設定新密碼</p>
 <h2 id="form-heading">請輸入新密碼</h2>
 <p class="reset-account-email" id="account-email-line" style="display:none;"></p>

 <form id="reset-form" novalidate>
 <div class="field" id="new-password-field">
 <label for="new-password" id="new-password-label">新密碼</label>
 <input type="password" id="new-password" placeholder="至少 6 個字元" autocomplete="new-password">
 <small class="err" id="new-password-err">密碼至少需要 6 個字元。</small>
 </div>
 <div class="field" id="confirm-password-field">
 <label for="confirm-password" id="confirm-password-label">確認新密碼</label>
 <input type="password" id="confirm-password" placeholder="請再輸入一次密碼" autocomplete="new-password">
 <small class="err" id="confirm-password-err">兩次輸入的密碼不一致。</small>
 </div>

 <button type="submit" class="submit-btn" id="submit-btn">更新密碼</button>
 </form>
 </div>

 <!-- 狀態三：重設完成 -->
 <div id="state-success" style="display:none;">
 <p class="eyebrow" id="success-eyebrow">完成</p>
 <h2 id="success-heading">密碼已更新</h2>
 <p class="reset-desc" id="success-desc">您的密碼已成功重設，請使用新密碼登入。</p>
 <button type="button" class="submit-btn" id="back-to-login-btn">返回登入頁</button>
 </div>

 <!-- 狀態四：連結無效或已過期 -->
 <div id="state-error" style="display:none;">
 <p class="eyebrow" id="error-eyebrow">連結無效</p>
 <h2 id="error-heading">連結無效或已過期</h2>
 <p class="reset-desc" id="error-desc">這個密碼重設連結可能已經使用過或已過期，請重新申請一次。</p>
 <button type="button" class="submit-btn" id="request-new-link-btn">回登入頁重新申請</button>
 </div>

 </div>
 </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-text"></span></div>

<script type="module" src="reset-password.js?v=2"></script>

</body>
</html>
