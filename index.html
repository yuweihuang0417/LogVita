<style>
 :root{
 --ink: #0f2a2b;
 --paper: #f6f8f6;
 --navy: #123334;
 --navy-deep: #0a2021;
 --mint: #79e2c4;
 --teal: #2bb8a3;
 --muted: #9fb8b6;
 --line: #dfe6e2;
 --error: #d9534f;
 --radius: 14px;
 }
 *{box-sizing:border-box;}
 html,body{margin:0;padding:0;height:100%;}
 body {
  background: var(--paper);
  color: var(--ink);
  font-family: "Noto Sans TC", "Noto Sans SC", -apple-system, "PingFang SC", "PingFang TC", "Microsoft YaHei", "Microsoft JhengHei", sans-serif;

 .stage{ display:flex; width:100%; min-height:100vh; }

 /* LEFT PANEL */
 .brand{
 position:relative;
 flex:1 1 44%;
 background:linear-gradient(165deg,var(--navy) 0%,var(--navy-deep) 100%);
 color:var(--paper);
 display:flex;
 flex-direction:column;
 justify-content:space-between;
 padding:48px 44px;
 overflow:hidden;
 min-height:100vh;
 }
 .brand::after{
 content:"";
 position:absolute;
 inset:0;
 background:radial-gradient(circle at 82% 12%, rgba(121,226,196,0.12), transparent 55%);
 pointer-events:none;
 }
 .brand-mark{
 display:flex;
 align-items:center;
 gap:10px;
 font-family:"Noto Serif TC", "Noto Serif SC", serif;
 font-size:20px;
 letter-spacing:0.02em;
 z-index:1;
 }
 .brand-mark .dot{
 width:9px;height:9px;border-radius:50%;background:var(--mint);
 box-shadow:0 0 12px rgba(121,226,196,0.7);
 }
 .brand-copy{ z-index:1; max-width:420px; }
 .brand-copy h1{
 font-family:"Noto Serif TC", "Noto Serif SC", serif;
 font-weight:600;
 font-size:clamp(30px,3.8vw,40px);
 line-height:1.45;
 margin:0 0 18px;
 letter-spacing:0.01em;
 }
 .brand-copy h1 em{
 font-style:normal;
 color:var(--mint);
 }
 .brand-copy p{
 font-size:15px;
 line-height:1.85;
 color:var(--muted);
 margin:0;
 }
 .trust{
 z-index:1;
 display:flex;
 align-items:center;
 gap:8px;
 margin-top:22px;
 font-size:13px;
 color:var(--muted);
 }
 .trust svg{ flex-shrink:0; }

 .pulse-wrap{ z-index:1; }
 .pulse-wrap svg{ display:block; width:100%; height:auto; }
 .pulse-line{
 fill:none;
 stroke:var(--mint);
 stroke-width:2.2;
 stroke-linecap:round;
 stroke-linejoin:round;
 stroke-dasharray:600;
 stroke-dashoffset:600;
 animation: draw 3.2s ease-in-out infinite;
 }
 @keyframes draw{
 0%{ stroke-dashoffset:600; }
 55%{ stroke-dashoffset:0; }
 100%{ stroke-dashoffset:-600; }
 }
 @media (prefers-reduced-motion: reduce){
 .pulse-line{ animation:none; stroke-dashoffset:0; }
 }

 /* RIGHT PANEL */
 .panel{
 flex:1 1 56%;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:40px 24px;
 }
 .card{ width:100%; max-width:400px; }
 .eyebrow{
 font-size:12.5px;
 letter-spacing:0.08em;
 color:#7c8c8a;
 margin:0 0 8px;
 }
 .card h2{
 font-family:"Noto Serif TC", "Noto Serif SC", serif;
 font-weight:600;
 font-size:26px;
 margin:0 0 28px;
 letter-spacing:0.01em;
 }

 .mode-toggle{
 display:flex;
 background:#e9efec;
 border-radius:999px;
 padding:4px;
 margin-bottom:28px;
 }
 .mode-toggle button{
 flex:1;
 border:none;
 background:transparent;
 padding:9px 0;
 font-size:14px;
 font-weight:600;
 font-family:inherit;
 color:#6e7f7c;
 border-radius:999px;
 cursor:pointer;
 transition:background .2s ease, color .2s ease;
 }
 .mode-toggle button.active{
 background:var(--navy);
 color:var(--paper);
 }

 .google-btn{
 width:100%;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:10px;
 padding:12px 16px;
 border-radius:10px;
 border:1px solid var(--line);
 background:#fff;
 font-family:inherit;
 font-size:14.5px;
 font-weight:600;
 color:var(--ink);
 cursor:pointer;
 transition:border-color .15s ease, box-shadow .15s ease;
 }
 .google-btn:hover{ border-color:#c3d1cc; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
 .google-btn:focus-visible, input:focus-visible, .mode-toggle button:focus-visible, .submit-btn:focus-visible{
 outline:2px solid var(--navy);
 outline-offset:2px;
 }

 .divider{
 display:flex;
 align-items:center;
 gap:12px;
 margin:22px 0;
 color:#8b9895;
 font-size:12.5px;
 letter-spacing:0.02em;
 }
 .divider::before, .divider::after{
 content:"";
 flex:1;
 height:1px;
 background:var(--line);
 }

 form{ display:flex; flex-direction:column; gap:16px; }
 .field label{
 display:block;
 font-size:13px;
 font-weight:600;
 margin-bottom:6px;
 color:#4c5a57;
 }
 .field input{
 width:100%;
 padding:11px 13px;
 border-radius:10px;
 border:1px solid var(--line);
 background:#fff;
 font-family:inherit;
 font-size:14.5px;
 color:var(--ink);
 }
 .field input::placeholder{ color:#b3bdb9; }
 .field small.err{
 display:none;
 color:var(--error);
 font-size:12.5px;
 margin-top:5px;
 }
 .field.invalid input{ border-color:var(--error); }
 .field.invalid small.err{ display:block; }

 .label-row {
 display: flex;
 justify-content: space-between;
 align-items: center;
 margin-bottom: 6px;
 }
 .label-row label {
 margin-bottom: 0 !important;
 }
 .forgot-btn-inline {
 background: none;
 border: none;
 font-family: inherit;
 font-size: 12.5px;
 font-weight: 600;
 color: var(--navy);
 cursor: pointer;
 padding: 0;
 text-decoration: underline;
 display: inline-block;
 }

 .submit-btn{
 margin-top:6px;
 width:100%;
 padding:12.5px 16px;
 border:none;
 border-radius:10px;
 background:var(--navy);
 color:var(--paper);
 font-family:inherit;
 font-size:15px;
 font-weight:700;
 cursor:pointer;
 transition:background .15s ease, transform .1s ease;
 }
 .submit-btn:hover{ background:#0e2829; }
 .submit-btn:active{ transform:scale(0.99); }

 .foot{
 margin-top:22px;
 font-size:13.5px;
 color:#7c8c8a;
 text-align:center;
 }
 .foot button{
 background:none;
 border:none;
 font-family:inherit;
 font-size:13.5px;
 font-weight:700;
 color:var(--navy);
 cursor:pointer;
 padding:0;
 }
 .legal{
 margin-top:16px;
 font-size:12px;
 line-height:1.7;
 color:#9aa8a5;
 text-align:center;
 }
 .legal a{
 color:var(--navy);
 font-weight:600;
 text-decoration:underline;
 cursor:pointer;
 }

 .toast{
 position:fixed;
 bottom:24px;
 left:50%;
 transform:translateX(-50%) translateY(20px);
 background:var(--navy);
 color:var(--paper);
 padding:13px 22px;
 border-radius:10px;
 font-size:14px;
 opacity:0;
 pointer-events:none;
 transition:opacity .25s ease, transform .25s ease;
 display:flex;
 align-items:center;
 gap:8px;
 box-shadow:0 10px 30px rgba(0,0,0,0.25);
 }
 .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
 .toast .dot{ width:8px;height:8px;border-radius:50%;background:var(--mint); }

 /* LANGUAGE SELECTOR */
 .language-switcher{
 position:absolute;
 top:28px;
 right:28px;
 z-index:5;
 }
 .language-switcher select{
 appearance:none;
 border:1px solid rgba(223,230,226,.8);
 background:rgba(255,255,255,.08);
 color:var(--paper);
 border-radius:999px;
 padding:8px 34px 8px 12px;
 font:500 13px/1 "Noto Sans TC",sans-serif;
 cursor:pointer;
 outline:none;
 background-image:linear-gradient(45deg,transparent 50%,#b9ccc8 50%),linear-gradient(135deg,#b9ccc8 50%,transparent 50%);
 background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
 background-size:5px 5px,5px 5px;
 background-repeat:no-repeat;
 }
 .language-switcher select:hover{background-color:rgba(255,255,255,.14);}
 .language-switcher select option{color:var(--ink);background:#fff;}

 /* MODAL (點擊跳出小方格) */
 .modal-overlay{
 position:fixed;
 inset:0;
 background:rgba(10,32,33,0.6);
 backdrop-filter:blur(3px);
 display:none;
 align-items:center;
 justify-content:center;
 z-index:100;
 padding:20px;
 }
 .modal-overlay.show{ display:flex; }
 .modal-box{
 background:#fff;
 width:100%;
 max-width:600px;
 border-radius:var(--radius);
 padding:28px;
 position:relative;
 box-shadow:0 20px 40px rgba(0,0,0,0.2);
 animation: popIn .2s ease-out;
 }
 @keyframes popIn{
 from{ opacity:0; transform:scale(0.95); }
 to{ opacity:1; transform:scale(1); }
 }
 .modal-close{
 position:absolute;
 top:16px;
 right:18px;
 background:none;
 border:none;
 font-size:22px;
 color:#7c8c8a;
 cursor:pointer;
 line-height:1;
 }
 .modal-box h3{
 margin:0 0 12px;
 font-family:"Noto Serif TC", "Noto Serif SC", serif;
 color:var(--navy);
 border-bottom: 1px solid var(--line);
 padding-bottom: 10px;
 }
 .modal-content{
 font-size:13.5px;
 line-height:1.7;
 color:#4c5a57;
 max-height:400px;
 overflow-y:auto;
 padding-right:8px;
 text-align:left;
 }
 .modal-content h4{
 margin: 14px 0 6px;
 color: var(--navy);
 font-size: 14.5px;
 }
 .modal-content ul{
 padding-left: 20px;
 margin: 6px 0;
 }
 .modal-content li{
 margin-bottom: 4px;
 }
 .modal-date{
 font-size: 12px;
 color: #7c8c8a;
 margin-bottom: 12px;
 }

 @media (max-width: 860px){
 .stage{ flex-direction:column; }
 .brand{ min-height:auto; padding:36px 28px; }
 .pulse-wrap{ margin-top:20px; }
 .panel{ padding:36px 22px 56px; }
 }
</style>
</head>

 // --- Firebase 以動態 import 載入，並用 try/catch 包起來 ---
 // 原本用「靜態 import」放在檔案最上面：只要這兩行載入失敗（例如用 file:// 直接開啟
 // 這個檔案、公司網路/廣告攔截器封鎖了 gstatic.com、或離線），整個 <script type="module">
 // 會直接中斷，導致下面所有程式碼（分頁切換、忘記密碼按鈕等）完全不會執行。
 // 改成動態 import + try/catch 後，即使 Firebase 載入失敗，UI 邏輯仍可正常運作，

     createUserWithEmailAndPassword, signInWithEmailAndPassword,
     sendPasswordResetEmail, updateProfile;
 let app, auth, googleProvider;
 let firebaseReady = false;
 let firebaseLoadError = null;

 try {
   const [{ initializeApp: _initializeApp }, authModule] = await Promise.all([
     import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js"),
     import("https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js")
   ]);
   ({
     getAuth, GoogleAuthProvider, signInWithPopup,
     createUserWithEmailAndPassword, signInWithEmailAndPassword,
     sendPasswordResetEmail, updateProfile
   } = authModule);
   initializeApp = _initializeApp;

   const firebaseConfig = {

     measurementId: "G-4YVJDN5Y7C"
   };

   app = initializeApp(firebaseConfig);

   firebaseReady = true;
 } catch (err) {
   firebaseLoadError = err;
   console.error('Firebase 載入失敗，帳號相關功能將無法使用（但介面互動仍可正常運作）:', err);

 let currentLanguage = localStorage.getItem('healthkeep-language') || navigator.language;
 if (!translations[currentLanguage]) {
 const langPrefix = currentLanguage.split('-')[0];
 if (langPrefix === 'zh') currentLanguage = currentLanguage.includes('CN') ? 'zh-CN' : 'zh-TW';
 else if (langPrefix === 'ja') currentLanguage = 'ja';
 else if (langPrefix === 'ko') currentLanguage = 'ko';
 else currentLanguage = 'en';
 }

 function setMode(next){
 mode = next;
 const t = translations[currentLanguage] || translations['zh-TW'];
 const isSignup = mode === 'signup';

 tabSignin.textContent = t.signIn;
 tabSignup.textContent = t.signUp;

 tabSignin.classList.toggle('active', !isSignup);
 tabSignup.classList.toggle('active', isSignup);
 tabSignin.setAttribute('aria-selected', String(!isSignup));
 tabSignup.setAttribute('aria-selected', String(isSignup));
 nameField.style.display = isSignup ? 'block' : 'none';

 const forgotBtn = document.getElementById('forgot-password-btn');
 if (forgotBtn) {
   forgotBtn.style.display = isSignup ? 'none' : 'inline-block';
 }

 heading.textContent = isSignup ? t.signUpTitle : t.signInTitle;
 eyebrow.textContent = isSignup ? t.start : t.welcome;
 submitBtn.textContent = isSignup ? t.create : t.signIn;
 footText.textContent = isSignup ? t.hasAccount : t.noAccount;
 footSwitch.textContent = isSignup ? t.signIn : t.createAccount;
 passwordInput.setAttribute('autocomplete', isSignup ? 'new-password' : 'current-password');
 clearErrors();
 }

 function applyLanguage(lang){
 const t = translations[lang] || translations['zh-TW'];
 const legal = legalTranslations[lang] || legalTranslations['zh-TW'];

 currentLanguage = lang;
 localStorage.setItem('healthkeep-language', lang);
 document.documentElement.lang = t.htmlLang;
 document.title = t.title;
 
 const brandMark = document.querySelector('.brand-mark');
 if (brandMark && brandMark.lastChild) brandMark.lastChild.textContent = ' ' + t.brandMark;
 
 document.querySelector('.brand-copy h1').innerHTML = t.h1;
 document.querySelector('.brand-copy p').textContent = t.brandDesc;
 document.querySelector('.trust span').textContent = t.trust;
 document.getElementById('google-btn').lastChild.textContent = ' ' + t.google;
 document.querySelector('.divider').textContent = t.orEmail;
 document.querySelector('label[for="name"]').textContent = t.name;
 document.getElementById('name').placeholder = t.namePh;
 document.querySelector('label[for="email"]').textContent = t.email;
 document.getElementById('email').placeholder = t.emailPh;
 document.querySelector('label[for="password"]').textContent = t.password;
 passwordInput.placeholder = t.passwordPh;

 const forgotBtn = document.getElementById('forgot-password-btn');
 if (forgotBtn) forgotBtn.textContent = t.forgotPassword;

 document.querySelector('#name-field .err').textContent = t.errName;
 document.querySelector('#email-field .err').textContent = t.errEmail;
 document.querySelector('#password-field .err').textContent = t.errPassword;
 document.querySelector('.legal').innerHTML = `${t.terms}<br>${t.privacy}`;
 
 if (legal) {
   const tosModal = document.getElementById('tos-modal');
   if (tosModal) {
     tosModal.querySelector('h3').textContent = legal.tosTitle;
     tosModal.querySelector('.modal-content').innerHTML = legal.tosContent;
   }

   const privacyModal = document.getElementById('privacy-modal');
   if (privacyModal) {
     privacyModal.querySelector('h3').textContent = legal.privacyTitle;
     privacyModal.querySelector('.modal-content').innerHTML = legal.privacyContent;
   }
 }

 bindModalEvents();
 
 languageSelect.value = lang;
 setMode(mode);
 }

 tabSignin.addEventListener('click', () => setMode('signin'));
 tabSignup.addEventListener('click', () => setMode('signup'));
 footSwitch.addEventListener('click', () => setMode(mode === 'signin' ? 'signup' : 'signin'));
 languageSelect.addEventListener('change', e => applyLanguage(e.target.value));

 function clearErrors(){
 document.querySelectorAll('.field').forEach(f => f.classList.remove('invalid'));
 }

 function showToast(text){
 const toast = document.getElementById('toast');
 document.getElementById('toast-text').textContent = text;
 toast.classList.add('show');
 setTimeout(()=> toast.classList.remove('show'), 2600);
 }

 function setLoading(isLoading){
 const forgotBtn = document.getElementById('forgot-password-btn');
 submitBtn.disabled = isLoading;
 googleBtn.disabled = isLoading;
 if (forgotBtn) forgotBtn.disabled = isLoading;
 }

 function translateAuthError(code){
 const t = translations[currentLanguage] || translations['zh-TW'];
 return t.errors[code] || t.generic;
 }

 document.getElementById('forgot-password-btn')?.addEventListener('click', async () => {
 clearErrors();
 const t = translations[currentLanguage] || translations['zh-TW'];

 if(!firebaseReady){
 showToast(t.generic);
 return;
 }

 const email = document.getElementById('email').value.trim();
 const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

 if(!emailOk){
 document.getElementById('email-field').classList.add('invalid');
 showToast(t.enterEmailPrompt);
 return;
 }

 setLoading(true);
 try {
 await sendPasswordResetEmail(auth, email);
 showToast(t.resetSentToast);
 } catch (err) {
 console.error(err);
 showToast(translateAuthError(err.code));
 } finally {
 setLoading(false);
 }
 });

 applyLanguage(currentLanguage);

 googleBtn.addEventListener('click', async () => {
 const t0 = translations[currentLanguage] || translations['zh-TW'];
 if(!firebaseReady){
 showToast(t0.generic);
 return;
 }
 setLoading(true);
 try {
 const result = await signInWithPopup(auth, googleProvider);
 const credential = GoogleAuthProvider.credentialFromResult(result);
 
 if (credential && credential.accessToken) {
 sessionStorage.setItem('drive_access_token', credential.accessToken);
 }

 const t = translations[currentLanguage] || translations['zh-TW'];
 showToast(`${t.welcomeUser}${result.user.displayName || result.user.email}`);
 window.location.href = 'dashboard-zhtw.html';
 } catch (err) {
 console.error(err);
 showToast(translateAuthError(err.code));
 } finally {
 setLoading(false);
 }
 });

 document.getElementById('auth-form').addEventListener('submit', async (e) => {
 e.preventDefault();
 clearErrors();
 let valid = true;

 const name = document.getElementById('name').value.trim();
 if(mode === 'signup' && !name){
 document.getElementById('name-field').classList.add('invalid');
 valid = false;
 }

 const email = document.getElementById('email').value.trim();
 const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
 if(!emailOk){
 document.getElementById('email-field').classList.add('invalid');
 valid = false;
 }

 const password = document.getElementById('password').value;
 if(password.length < 8){
 document.getElementById('password-field').classList.add('invalid');
 valid = false;
 }

 if(!valid) return;

 const t = translations[currentLanguage] || translations['zh-TW'];
 if(!firebaseReady){
 showToast(t.generic);
 return;
 }

 setLoading(true);
 try {
 const recaptchaToken = await new Promise((resolve, reject) => {
   if (typeof grecaptcha === 'undefined') {
     reject(new Error('reCAPTCHA SDK 未載入'));
     return;
   }
   grecaptcha.ready(() => {
     grecaptcha.execute('6LdmRI0tAAAAADVz24cBddUISehgAZqtO9r2Qmp4', { action: mode })
       .then(resolve)
       .catch(reject);
   });
 });

 if(mode === 'signup'){
 const cred = await createUserWithEmailAndPassword(auth, email, password);
 await updateProfile(cred.user, { displayName: name });
 showToast(t.successSignup);
 } else {
 await signInWithEmailAndPassword(auth, email, password);
 showToast(t.successSignin);
 }
 window.location.href = 'dashboard-zhtw.html';
 } catch (err) {
 console.error(err);
 showToast(translateAuthError(err.code));
 } finally {
 setLoading(false);
 }
 });
</script>
